
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172554">
    <title>Sin conexión | Inventia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        main {
            max-width: 440px;
            padding: 32px;
            text-align: center;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
        }

        h1 {
            color: #172554;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        button {
            padding: 11px 18px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Inventia</h1>
        <h2>No hay conexión</h2>

        <p>
            No podemos comunicarnos con el servidor.
            Comprueba tu conexión y vuelve a intentarlo.
        </p>

        <button onclick="location.reload()">
            Intentar de nuevo
        </button>
    </main>
</body>
</html>
