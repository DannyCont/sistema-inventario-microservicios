services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: inventario_completo
      DB_USER: inventario
      DB_PASS: inventario123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inventario_completo
      MYSQL_USER: inventario
      MYSQL_PASSWORD: inventario123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/inventario_completo.sql:/docker-entrypoint-initdb.d/01-inventario.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data: