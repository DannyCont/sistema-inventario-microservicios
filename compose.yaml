services:
  web:
    image: sistema-inventario:latest
    build: .
    ports:
      # Jenkins usa el puerto 8080, por eso la aplicación se publica en 8082
      - "8082:80"
    environment:
      DB_HOST: db
      DB_NAME: inventario_completo
      DB_USER: inventario
      DB_PASS: inventario123
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db:
    # Se fija la versión 8.0.36: la imagen "mysql:8.0" más reciente no arranca en
    # equipos con CPU anteriores a x86-64-v3 (error "exec format error").
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inventario_completo
      MYSQL_USER: inventario
      MYSQL_PASSWORD: inventario123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/inventario_completo.sql:/docker-entrypoint-initdb.d/01-inventario.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
