services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment: &app_environment
      DB_HOST: db
      DB_NAME: inventario_completo
      DB_USER: inventario
      DB_PASS: inventario123
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      migrar:
        condition: service_completed_successfully

  push:
    build: .
    command: ["php", "config/enviar-push.php"]
    environment: *app_environment
    restart: on-failure
    depends_on:
      migrar:
        condition: service_completed_successfully

  migrar:
    image: mysql:8.0
    environment:
      MYSQL_PWD: inventario123
    volumes:
      - ./database/pwa.sql:/migration.sql:ro
    command: ["sh", "-c", "mysql -h db -u inventario inventario_completo < /migration.sql"]
    depends_on:
      db:
        condition: service_healthy

  https:
    image: caddy:2-alpine
    profiles: ["movil"]
    ports:
      - "8443:8443"
    environment:
      FLEXI_LAN_HOST: ${FLEXI_LAN_HOST:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inventario_completo
      MYSQL_USER: inventario
      MYSQL_PASSWORD: inventario123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/inventario_completo.sql:/docker-entrypoint-initdb.d/01-inventario.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u inventario -pinventario123 inventario_completo -e \"SELECT 1 FROM movimientos LIMIT 1\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  caddy_data: